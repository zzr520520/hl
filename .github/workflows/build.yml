name: Build FoxFeature dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls "$THEOS/sdks" | head

      - name: Build
        run: |
          make clean THEOS="$THEOS" || true
          make -j"$(sysctl -n hw.ncpu)" THEOS="$THEOS" FINALPACKAGE=1
          mkdir -p dist
          DYLIB="$(find .theos -name 'FoxFeature.dylib' -type f | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" dist/FoxFeature.dylib
          ldid -S dist/FoxFeature.dylib
          cp -R inject dist/inject
          cp README.md dist/README.md
          file dist/FoxFeature.dylib
          ls -lh dist

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FoxFeature-dylib
          path: dist
          if-no-files-found: error
